version: '3.8'

services:
  bridge:
    build: .
    mem_limit: 512m
    cpus: 1.0
    container_name: bridge
    environment:
      - LOG_LEVEL=info
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-}
      - DATABASE_URL=postgresql://bridge:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/bridge?sslmode=disable
      - RABBITMQ_URL=amqp://bridge:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}@rabbitmq:5672/
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./workflows:/app/workflows:ro
      - ./policies:/app/policies:ro
    networks:
      - bridge-network
    healthcheck:
      test: ["CMD", "bridge", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    mem_limit: 1g
    cpus: 1.0
    container_name: bridge-postgres
    environment:
      - POSTGRES_DB=bridge
      - POSTGRES_USER=bridge
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bridge -d bridge"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bridge-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    mem_limit: 1g
    cpus: 1.0
    container_name: bridge-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=bridge
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - bridge-network
    restart: unless-stopped

  # OPA for policy evaluation (optional)
  opa:
    image: openpolicyagent/opa:1.22.4-debug@sha256:bc5909a9ee68feaac292690909361ec489383dad61e72e5c7e84696fab041977
    mem_limit: 256m
    cpus: 0.5
    container_name: bridge-opa
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "/policies"
    ports:
      - "8181:8181"
    volumes:
      - ./policies:/policies:ro
    networks:
      - bridge-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8181/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:

networks:
  bridge-network:
    driver: bridge
